<title>Workout Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --panel2: #eef0f4; --line: #dfe2e8;
    --fg: #14181f; --muted: #5d6675; --accent: #e8501f; --accent-fg: #ffffff;
    --good: #12805c; --bad: #c62828; --shadow: 0 1px 2px rgba(20,24,31,.06), 0 8px 24px rgba(20,24,31,.06);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "DM Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0d1117; --panel: #151b24; --panel2: #1c2430; --line: #263041;
    --fg: #eef1f6; --muted: #8e9aae; --accent: #ff6b3d; --accent-fg: #170a04;
    --good: #3ddc97; --bad: #ff6b6b; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0d1117; --panel: #151b24; --panel2: #1c2430; --line: #263041;
    --fg: #eef1f6; --muted: #8e9aae; --accent: #ff6b3d; --accent-fg: #170a04;
    --good: #3ddc97; --bad: #ff6b6b; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; margin: 0; padding-inline: 20px; padding-block: 28px 56px; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; margin: 0; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 14px; }
  .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 22px; }
  .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .lbl em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { cursor: pointer; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: inline-block; padding: 7px 14px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-weight: 500; font-size: 14px; transition: background .15s, border-color .15s, color .15s; }
  .chip:hover span { border-color: var(--muted); }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .chip input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }
  select, input[type=text], input[type=password] { width: 100%; padding: 10px 12px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .total { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--accent); }
  small { color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 11px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); flex: 1 1 140px; }
  button.primary:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .results { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .empty { border: 1px dashed var(--line); border-radius: 16px; padding: 48px 24px; text-align: center; color: var(--muted); }
  .empty b { display: block; font-family: var(--display); font-size: 22px; color: var(--fg); margin-bottom: 6px; }
  .err { background: color-mix(in srgb, var(--bad) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); border-radius: 12px; padding: 12px 14px; }
  .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 24px; }
  .spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { display: grid; grid-template-columns: 40px minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .idx { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--accent); line-height: 1.1; }
  .card h3 { margin: 0 0 4px; font-family: var(--display); font-size: 18px; line-height: 1.25; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tagp { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
  .why { margin: 0; color: var(--muted); }
  .rx { grid-column: 2 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; border-top: 1px solid var(--line); padding-top: 12px; font-variant-numeric: tabular-nums; }
  .rx b { display: inline; white-space: nowrap; font-family: var(--display); font-size: 24px; line-height: 1.1; }
  .swap { margin-left: auto; padding: 6px 12px; font-size: 13px; }
  .card.busy { opacity: .55; }
  .rx small { text-transform: uppercase; letter-spacing: .06em; }
  .mist { border-left: 1px solid var(--line); padding-left: 14px; min-width: 0; }
  .mh { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .desc { margin: 0 0 12px; font-size: 13.5px; color: var(--fg); }
  .mist ul { margin: 0; padding-left: 16px; font-size: 13.5px; }
  .mist li { margin-bottom: 3px; }
  @media (max-width: 1100px) { .card { grid-template-columns: 40px minmax(0, 1fr); } .mist { grid-column: 2 / -1; border-left: 0; border-top: 1px solid var(--line); padding: 10px 0 0; } }
  @media (max-width: 520px) { .mist { grid-column: 2; } .card { grid-template-columns: 32px minmax(0, 1fr); } }
  .checks { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .checks h2 { font-family: var(--display); font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; }
  .checks ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
  .checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
  .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--bg); }
  .pass .dot { background: var(--good); } .fail .dot { background: var(--bad); }
  pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; white-space: pre-wrap; overflow-x: auto; }
</style>

$("total").oninput = () => $("totalVal").textContent = $("total").value;
const checked = name => [...document.querySelectorAll(`input[name=${name}]:checked`)].map(x => x.value);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function splitCounts(groups, total) {
  const base = Math.floor(total / groups.length), extra = total % groups.length, out = {};
  groups.forEach((g, i) => out[g] = base + (i < extra ? 1 : 0));
  return out;
}

function pickForGroup(pool, parts, n) {
  const buckets = {};
  parts.forEach(p => { const rows = shuffle(pool.filter(r => r.BodyPart === p)); if (rows.length) buckets[p] = rows; });
  const picks = [];
  while (picks.length < n && Object.keys(buckets).length) {
    for (const p of shuffle(Object.keys(buckets))) {
      if (picks.length === n) break;
      picks.push(buckets[p].pop());
      if (!buckets[p].length) delete buckets[p];
    }
  }
  return picks;
}

function select(groups, equipment, level, total) {
  const pool = DATA.filter(r => equipment.includes(r.Equipment) && r.Level === level);
  const counts = splitCounts(groups, total), picks = [], shortages = [];
  for (const g of groups) {
    const gpool = pool.filter(r => MUSCLE_GROUPS[g].includes(r.BodyPart));
    if (gpool.length < counts[g]) { shortages.push({ group: g, available: gpool.length, requested: counts[g] }); continue; }
    pickForGroup(gpool, MUSCLE_GROUPS[g], counts[g]).forEach(r => picks.push({ ...r, Group: g }));
  }
  return { picks, shortages };
}

const SYSTEM = "You write sets/reps for a fixed list of exercises. Rules: use ONLY the exercises given; do not add, remove, rename, or swap exercises; do not claim rep ranges are established guidelines (label any rule of thumb 'assumption, not sourced'); give no medical advice. For each exercise also write a 1 to 2 sentence description of how the exercise is performed (base it on the Desc given when present; no medical claims), and list 2 to 3 common technique mistakes (short phrases, form and setup only, no injury or medical claims). Respond with JSON only, no prose or code fences, in this shape: {\"exercises\":[{\"title\":\"<exact given title>\",\"sets\":<int>,\"reps\":\"<string>\",\"reason\":\"<one line tied to the goal>\",\"description\":\"<1-2 sentences on how to perform it>\",\"mistakes\":[\"<short phrase>\"]}]}";

async function callModel(picks, goal) {
  const sample = await claude.use("sample");
  if (!sample) throw new Error("Claude access is not available in this view.");
  const payload = { goal, exercises: picks.map(p => ({ Title: p.Title, BodyPart: p.BodyPart, Equipment: p.Equipment, ...(p.Desc ? { Desc: p.Desc } : {}) })) };
  const r = await sample(SYSTEM + "\n\nInput:\n" + JSON.stringify(payload), { cache: false });
  return r.text;
}

function parseOutput(raw) {
  let t = raw.trim();
  if (t.startsWith("```")) t = t.replace(/^```(json)?/i, "").replace(/```\s*$/, "").trim();
  try {
    const d = JSON.parse(t), items = Array.isArray(d) ? d : d.exercises;
    if (!Array.isArray(items) || !items.every(i => i && typeof i === "object")) throw new Error("expected a list of exercise objects");
    return { items };
  } catch (e) { return { error: "Could not parse model JSON: " + e.message }; }
}

function runChecks(picks, items, groups, equipment, level, total) {
  const titles = picks.map(p => p.Title), allowed = new Set(groups.flatMap(g => MUSCLE_GROUPS[g])), known = new Set(DATA.map(r => r.Title));
  const c = {};
  c["1. Exercise count equals selected total"] = picks.length === total;
  c["2. All exercises exist in cleaned dataset"] = titles.every(t => known.has(t));
  c["3. All match selected equipment and level"] = picks.every(p => equipment.includes(p.Equipment) && p.Level === level);
  c["4. BodyParts in selected groups; every group represented"] = picks.every(p => allowed.has(p.BodyPart)) && groups.every(g => picks.some(p => MUSCLE_GROUPS[g].includes(p.BodyPart)));
  c["5. No duplicate Titles"] = new Set(titles).size === titles.length;
  let ok6 = false;
  if (items) {
    const mt = items.map(i => String(i.title)).sort();
    const complete = items.every(i => i.sets != null && i.sets !== "" && i.reps != null && i.reps !== "" && String(i.reason ?? "").trim() && String(i.description ?? "").trim() && Array.isArray(i.mistakes) && i.mistakes.length > 0 && i.mistakes.every(x => String(x).trim()));
    ok6 = complete && JSON.stringify(mt) === JSON.stringify([...titles].sort());
  }
  c["6. Model gave sets, reps, reason, description and mistakes for every exercise, no extras"] = ok6;
  return c;
}

let lastRecord = null;
let cur = null; // working state for the current workout (used by Swap out)

async function generate() {
  const groups = checked("g"), equipment = checked("e"), level = $("level").value, total = +$("total").value, goal = $("goal").value.trim();
  const out = $("out");
  if (groups.length < 1 || groups.length > 2) { out.innerHTML = '<div class="err">Select at least 1 and at most 2 muscle groups.</div>'; return; }
  if (!equipment.length) { out.innerHTML = '<div class="err">Select at least one piece of equipment.</div>'; return; }
  const { picks, shortages } = select(groups, equipment, level, total);
  const rec = { timestamp: new Date().toISOString(), inputs: { groups, equipment, level, total, goal }, shortages, picks: picks.map(({ Desc, ...p }) => p), model_raw: null, model_items: null, error: null, checks: null };
  lastRecord = rec; $("dl").disabled = false;
  if (shortages.length) {
    out.innerHTML = shortages.map(s => `<div class="err">Not enough exercises for ${esc(s.group)}: ${s.available} available, ${s.requested} requested. Adjust equipment, level, muscle groups, or total.</div>`).join("");
    return;
  }
  cur = { picks, groups, equipment, level, total, goal, rejected: new Set(), busy: -1, notice: "" };
  rec.swaps = [];
  out.innerHTML = '<div class="loading"><div class="spin"></div>Building your workout...</div>';
  try { rec.model_raw = await callModel(picks, goal); const p = parseOutput(rec.model_raw); rec.model_items = p.items || null; rec.error = p.error || null; }
  catch (e) { rec.error = "API call failed: " + e.message; }
  rec.checks = runChecks(picks, rec.model_items, groups, equipment, level, total);
  render(rec);
}

function render(rec) {
  let h = cur && cur.notice ? `<div class="err">${esc(cur.notice)}</div>` : "";
  if (rec.error) {
    h += `<div class="err">${esc(rec.error)}</div>`;
    if (rec.model_raw) h += `<pre>${esc(rec.model_raw)}</pre>`;
  } else {
    const by = Object.fromEntries(rec.model_items.map(i => [i.title, i]));
    h += '<div class="cards">' + rec.picks.map((p, n) => { const m = by[p.Title] || {};
      return `<div class="card${cur && cur.busy === n ? " busy" : ""}"><div class="idx">${n + 1}</div><div><h3>${esc(p.Title)}</h3><div class="meta"><span class="tagp">${esc(p.Group)}</span><span class="tagp">${esc(p.BodyPart)}</span><span class="tagp">${esc(p.Equipment)}</span></div><p class="why">${esc(m.reason)}</p></div><div class="mist"><div class="mh">Description</div><p class="desc">${esc(m.description)}</p><div class="mh">Common mistakes</div><ul>${(Array.isArray(m.mistakes) ? m.mistakes : []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div class="rx"><b>${esc(m.sets)} &times; ${esc(m.reps)}</b><small>sets &times; reps</small><button class="swap" data-swap="${n}"${cur && cur.busy >= 0 ? " disabled" : ""}>${cur && cur.busy === n ? "Swapping..." : "Swap out"}</button></div></div>`; }).join("") + "</div>";
  }
  const entries = Object.entries(rec.checks), passed = entries.filter(([, v]) => v).length;
  h += `<div class="checks"><h2><span>Checks</span><span>${passed}/${entries.length} passed</span></h2><ul>` +
    entries.map(([k, v]) => `<li class="${v ? "pass" : "fail"}"><span class="dot">${v ? "&#10003;" : "&#10005;"}</span><span>${esc(k.replace(/^\d+\. /, ""))}</span></li>`).join("") + "</ul></div>";
  $("out").innerHTML = h;
}

async function swapOut(i) {
  if (!cur || cur.busy >= 0 || !lastRecord || lastRecord.error) return;
  const rec = lastRecord, old = cur.picks[i];
  cur.notice = "";
  cur.rejected.add(old.Title);
  const taken = new Set(cur.picks.map(p => p.Title));
  const parts = MUSCLE_GROUPS[old.Group];
  const cands = DATA.filter(r => cur.equipment.includes(r.Equipment) && r.Level === cur.level && parts.includes(r.BodyPart) && !taken.has(r.Title) && !cur.rejected.has(r.Title));
  if (!cands.length) { cur.notice = `No other ${old.Group} exercises match your equipment and level. Change your filters to get more options.`; render(rec); return; }
  // keep BodyParts spread: favor the one this group uses least right now
  const used = p => cur.picks.filter(q => q.Group === old.Group && q.BodyPart === p && q.Title !== old.Title).length;
  const best = Math.min(...[...new Set(cands.map(c => c.BodyPart))].map(used));
  const pool = cands.filter(c => used(c.BodyPart) === best);
  const pick = { ...pool[Math.floor(Math.random() * pool.length)], Group: old.Group };
  cur.busy = i; render(rec);
  try {
    const raw = await callModel([pick], cur.goal);
    const parsed = parseOutput(raw);
    if (parsed.error) throw new Error(parsed.error);
    cur.picks[i] = pick;
    rec.picks[i] = (({ Desc, ...p }) => p)(pick);
    rec.model_items = rec.model_items.filter(m => m.title !== old.Title).concat(parsed.items);
    rec.model_raw = rec.model_raw + "\n\n--- swap " + (i + 1) + " ---\n" + raw;
    rec.swaps.push({ position: i + 1, removed: old.Title, added: pick.Title, timestamp: new Date().toISOString() });
    rec.checks = runChecks(cur.picks, rec.model_items, cur.groups, cur.equipment, cur.level, cur.total);
  } catch (e) {
    cur.rejected.delete(old.Title);
    cur.notice = "Could not swap this exercise: " + (e.message || e.code || "unknown error") + ". Your original exercise is unchanged.";
  }
  cur.busy = -1; render(rec);
}

$("out").addEventListener("click", ev => {
  const b = ev.target.closest("[data-swap]");
  if (b) swapOut(+b.dataset.swap);
});

$("gen").onclick = generate;
$("regen").onclick = generate;
$("dl").onclick = async () => {
  try {
    const dl = await claude.use("downloads");
    if (!dl) { $("out").insertAdjacentHTML("beforeend", '<div class="err">Saving files is not available here.</div>'); return; }
    await dl.save({ filename: new Date().toISOString().replace(/[:.]/g, "-") + ".json", data: JSON.stringify(lastRecord, null, 2) });
  } catch (e) { /* viewer declined */ }
};
